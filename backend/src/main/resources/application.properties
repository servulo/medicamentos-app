quarkus.http.root-path=/api/v1
quarkus.http.host=0.0.0.0

quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:medicamentos}
quarkus.datasource.password=${DB_PASSWORD:medicamentos}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/medicamentos}
quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.database.generation=validate

# Disabled by default for local/docker test-auth; enable with OIDC_* env in production
quarkus.oidc.enabled=${OIDC_ENABLED:false}
quarkus.oidc.provider=google
quarkus.oidc.client-id=${GOOGLE_CLIENT_ID:change-me}
quarkus.oidc.credentials.secret=${GOOGLE_CLIENT_SECRET:change-me}
quarkus.oidc.application-type=service
quarkus.oidc.authentication.user-info-required=true

app.admin.email=${ADMIN_EMAIL:admin@example.com}
app.timezone=${APP_TIMEZONE:America/Sao_Paulo}
app.auth.test-mode=${APP_AUTH_TEST_MODE:true}
app.vapid.public-key=${VAPID_PUBLIC_KEY:not-configured}
app.vapid.private-key=${VAPID_PRIVATE_KEY:not-configured}
app.vapid.subject=${VAPID_SUBJECT:mailto:admin@example.com}

quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:4200,http://localhost:8088}
quarkus.http.cors.methods=GET,POST,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=Authorization,Content-Type,X-Test-User-Email,X-Test-User-Sub
quarkus.http.cors.access-control-allow-credentials=true

%dev.app.auth.test-mode=true
%dev.quarkus.oidc.enabled=false
%dev.quarkus.datasource.devservices.enabled=true
%dev.quarkus.datasource.devservices.image-name=postgres:16

%test.app.auth.test-mode=true
%test.quarkus.oidc.enabled=false
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:medicamentos;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=sa
%test.quarkus.datasource.devservices.enabled=false
%test.quarkus.hibernate-orm.database.generation=none
%test.quarkus.flyway.migrate-at-start=true
