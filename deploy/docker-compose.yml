services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: medicamentos
      POSTGRES_USER: medicamentos
      POSTGRES_PASSWORD: medicamentos
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medicamentos -d medicamentos"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    environment:
      DB_URL: jdbc:postgresql://db:5432/medicamentos
      DB_USERNAME: medicamentos
      DB_PASSWORD: medicamentos
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Sao_Paulo}
      APP_AUTH_TEST_MODE: ${APP_AUTH_TEST_MODE:-true}
      OIDC_ENABLED: ${OIDC_ENABLED:-false}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-not-configured}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-not-configured}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@example.com}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4200,http://localhost:8088}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - "4200:80"
    depends_on:
      - backend

  proxy:
    image: nginx:1.27-alpine
    ports:
      - "8443:443"
      - "8088:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    profiles:
      - tls

volumes:
  pgdata:
